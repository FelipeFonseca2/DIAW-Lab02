spring.application.name=aluguel

# Banco de dados (Supabase / PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticacao (JWT)
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-32b}
app.jwt.expiracao-horas=8

# Origens liberadas para o front-end
app.cors.origens=${CORS_ORIGINS:http://localhost:5173}
